resources_references: "config/resources_references.yaml"

output: "config/output_reference_files.yaml"

cnvkit_create_targets:
  container: "docker://hydragenetics/cnvkit:0.9.9"

cnvkit_create_anti_targets:
  container: "docker://hydragenetics/cnvkit:0.9.9"

cnvkit_build_normal_reference:
  container: "docker://hydragenetics/cnvkit:0.9.9"

bed_to_interval_list:
  container: "docker://hydragenetics/gatk4:4.2.2.0"

preprocess_intervals:
  container: "docker://hydragenetics/gatk4:4.2.2.0"

collect_read_counts:
  container: "docker://hydragenetics/gatk4:4.2.2.0"

create_read_count_panel_of_normals:
  container: "docker://hydragenetics/gatk4:4.2.2.0"

ichorcna_offtarget_read_counter:
  container: "docker://hydragenetics/ichorcna:v260817"
  window: 500000

ichorcna_offtarget_wig_list:
  container: "docker://hydragenetics/ichorcna:v260817"

ichorcna_offtarget_panel_of_normals:
  container: "docker://hydragenetics/ichorcna:v260817"
  gc_wig: "/opt/ichorCNA/inst/extdata/gc_hg19_500kb.wig"
  map_wig: "/opt/ichorCNA/inst/extdata/map_hg19_500kb.wig"
  centromere: "/opt/ichorCNA/inst/extdata/GRCh37.p13_centromere_UCSC-gapTable.txt"
  # createPanelOfNormals.R never forwards --genomeStyle to its own call to
  # loadReadCountsFromWig(), which defaults to NCBI internally regardless -
  # so the sample counts get force-converted to NCBI style no matter what.
  # Setting NCBI here too keeps chrs/centromere consistent with that.
  genome_style: "NCBI"

jumble_count:
  container: "docker://hydragenetics/jumble:260310"

jumble_reference:
  container: "docker://hydragenetics/jumble:260310"
  annotation: "/projects/wp1/nobackup/ngs/utveckling/Twist_DNA_DATA/jumble/jumble_annotation/"

msisensor_pro_scan:
  container: "docker://hydragenetics/msisensor_pro:1.2.0"

msisensor_pro_baseline:
  container: "docker://hydragenetics/msisensor_pro:1.2.0"

purecn_coverage:
  container: "docker://hydragenetics/purecn:2.2.0"

purecn_coverage_list:
  container: "docker://hydragenetics/purecn:2.2.0"

purecn_interval_file:
  container: "docker://hydragenetics/purecn:2.2.0"
  genome: hg19

purecn_normal_db:
  container: "docker://hydragenetics/purecn:2.2.0"

reference:
  artifacts: /dev/null
  background: /dev/null
  mappability: "/projects/wp1/nobackup/ngs/utveckling/Twist_DNA_DATA/bed/access-5k-mappable.hg19.bed"

svdb_build:
  container: "docker://hydragenetics/svdb:2.5.0"

svdb_export:
  container: "docker://hydragenetics/svdb:2.5.0"
