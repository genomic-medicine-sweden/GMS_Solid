$schema: "http://json-schema.org/draft-04/schema#"
description: snakemake rule input and output files description file
type: object
properties:
  call_small_cnv_amplifications:
    type: object
    description: input and output parameters for call_small_cnv_amplifications
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          cnv_data:
            type: string
            description: Copy number region data from GATK CNV
          regions_file:
            type: string
            description: File with genes, gene regions with surrounding cnv-probes and the actual gene region
      output:
        type: object
        description: list of outputs
        properties:
          amplifications:
            type: string
            description: Text file with the called amplifications

  call_small_cnv_deletions:
    type: object
    description: input and output parameters for call_small_cnv_deletions
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          cnv_data:
            type: string
            description: Copy number region data from GATK CNV
          regions_file:
            type: string
            description: File with genes, gene regions with surrounding cnv-probes and the actual gene region
      output:
        type: object
        description: list of outputs
        properties:
          deletions:
            type: string
            description: Text file with the called deletions

  cnv_tsv_report:
    type: object
    description: input and output parameters for cnv_tsv_report
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          amplifications:
            type: string
            description: File with small CNV amplifications generated by call_small_cnv_amplifications
          deletions:
            type: string
            description: File with small CNV amplifications generated by call_small_cnv_deletions
          org_vcfs:
            type: string
            description: Unfiltered vcf-files with merged calls from CNVkit and GATK CNV
          tc_file:
            type: string
            description: Tumor content of sample
          vcfs:
            type: string
            description: Filtered vcf-files with merged calls from CNVkit and GATK CNV
      output:
        type: object
        description: list of outputs
        properties:
          tsv:
            type: string
            description: A CNV report in excel friendly format
          tsv_additional_only:
            type: string
            description: File where only additional CNVs are reported. Used for extra table in CNV-html report.
          tsv_chrom_arms:
            type: string
            description: File where large CNVs are reported. Used for extra table in CNV-html report.

  estimate_ctdna_fraction:
    type: object
    description: input and output parameters for estimate_ctdna_fraction
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: Small variant vcf with vep annotations
          cnvkit_cns:
            type: string
            description: CNVkit segment file, used to look up local copy number at each candidate variant's position
          cnvkit_cnr:
            type: string
            description: CNVkit bin-level ratio file, used to infer sample sex from chrX vs autosome log2 ratios
      output:
        type: object
        description: list of outputs
        properties:
          ctDNA_fraction:
            type: string
            description: Estimated ctDNA fraction based on SNV data, reported as both a raw (VAF*2) and a copy-number-adjusted percentage
          ctDNA_fraction_info:
            type: string
            description: Per-candidate diagnostics (raw/adjusted percentage, local copy number, assumed mutant copies, normal copy number used) for variants passing all filters

  exon_skipping:
    type: object
    description: input and output parameters for exon_skipping
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bed:
            type: string
            description: Bed file used to extract exonic genomic regions
          junction:
            type: string
            description: Junction file from STAR based on split reads
      output:
        type: object
        description: list of outputs
        properties:
          result:
            type: string
            description: Report with info regarding MET exon 14 and EGFR vIII skipping

  fix_vcf_ad_for_qci:
    type: object
    description: input and output parameters for fix_vcf_ad_for_qci
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: Vcf file with SNV and INDEL calls
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: QCI compatible vcf file with SNV and INDEL calls were the AD field has been corrected

  hotspot_report:
    type: object
    description: input and output parameters for hotspot_report
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: Vcf file with filtered SNV and INDEL calls
          vcf_index:
            type: string
            description: Vcf tabix index file
          gvcf:
            type: string
            description: Genome vcf file coverage and allele information on all positions in the panel
          gvcf_index:
            type: string
            description: Genome vcf tabix index file
      output:
        type: object
        description: list of outputs
        properties:
          report:
            type: string
            description: Excel friendly text report with hotspot position qc information

  hotspot_report_aa_translate:
    type: object
    description: input and output parameters for hotspot_report_aa_translate
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          report:
            type: string
            description: coverage and mutations file from hotspot report
      output:
        type: object
        description: list of outputs
        properties:
          report:
            type: string
            description: coverage and mutations file from hotspot report with aa change in one letter code

  house_keeping_gene_coverage:
    type: object
    description: input and output parameters for house_keeping_gene_coverage
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: Bam file
          bai:
            type: string
            description: Bam index file
          bed:
            type: string
            description: Bed file with gene regions used to obtain genomic coordinates
      output:
        type: object
        description: list of outputs
        properties:
          result:
            type: string
            description: Excel frienly text report with gene coverage information

  ichorcna_purity:
    type: object
    description: input and output parameters for ichorcna_purity
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          params_txt:
            type: string
            description: params.txt from ichorcna_offtarget_run
      output:
        type: object
        description: list of outputs
        properties:
          purity:
            type: string
            description: tsv with tumor fraction, ploidy, subclone fraction and noise for the selected ichorCNA solution

  jumble_gis_score:
    type: object
    description: input and output parameters for jumble_gis_score
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          gis_csv:
            type: string
            description: GIS csv file from jumble_run
          purecn_csv:
            type: string
            description: PureCN result csv with purity and ploidy from the same fit
          ichorcna_params:
            type: string
            description: ichorCNA params file with the tumor fraction and ploidy estimates
      output:
        type: object
        description: list of outputs
        properties:
          gis_score:
            type: string
            description: >-
              Predicted GIS for a best estimate (PureCN) and for the pathology, PureCN and ichorCNA estimates, at
              ploidy 2 and at each method's tumor DNA fraction, with a manual review flag

  report_fusions:
    type: object
    description: input and output parameters for report_fusions
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          arriba:
            type: string
            description: Called fusions by Arriba
          bam:
            type: string
            description: Bam file
          bai:
            type: string
            description: Bam index file
          bed:
            type: string
            description: Bed file with regions of the design
          bed_extra_annotation:
            type: string
            description: Bed file with gene annotations of regions outide of the design
          fusioncatcher:
            type: string
            description: Called fusions by FusionCatcher
          star_fusion:
            type: string
            description: Called fusions by StarFusion
      output:
        type: object
        description: list of outputs
        properties:
          fusions:
            type: string
            description: Excel friendly text report with filtered fusion calls from respective caller

  report_gene_fuse:
    type: object
    description: input and output parameters for report_gene_fuse
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fusions:
            type: string
            description: Called fusions by GeneFuse
      output:
        type: object
        description: list of outputs
        properties:
          report:
            type: string
            description: Excel friendly text report with filtered fusion calls from GeneFuse

  purecn_modify_vcf:
    type: object
    description: input and output parameters for purecn_modify_vcf
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: hard filtered vcf with variants from mutect2 for purecn
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: hard filtered vcf with corrected MBQ values for purecn 

  somalier_best_match_report:
    type: object
    description: input and output parameters for somalier_best_match_report
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          pairs:
            type: string
            description: Somalier relate pairs file
      output:
        type: object
        description: list of outputs
        properties:
          report:
            type: string
            description: Somalier best match report

  somalier_dna_dna_report:
    type: object
    description: input and output parameters for somalier_dna_dna_report
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          pairs:
            type: string
            description: Somalier relate pairs file
      output:
        type: object
        description: list of outputs
        properties:
          report:
            type: string
            description: Somalier DNA-DNA best match report

  uv_hotspots:
    type: object
    description: input and output parameters for uv_hotspots
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: final deduplicated (or UMI consensus) BAM file
          bai:
            type: string
            description: index of the BAM file
          positions:
            type: string
            description: >-
              UV hotspot position table (site, gene, rank, motif, motif_strand, cls, chr, pos, ref, alt, CpG) with
              Y1/Y2 hotspot, C5 and flank positions of the YYTTCCG ETS promoter sites
      output:
        type: object
        description: list of outputs
        properties:
          positions:
            type: string
            description: >-
              per position fragment counts on the pyrimidine strand (C, C>T, C>A, C>G), C>T fraction, read
              orientation of C>T fragments, discordant mate pairs, hit and flank exclusion flags
          sites:
            type: string
            description: >-
              per site hotspot C>T counts, hit and possible germline flags, CC>TT fragments, C5 counts and the
              non-CpG and CpG flank C>T background
          summary:
            type: string
            description: >-
              one-row sample summary with sites hit, hotspot, C5 and flank C>T rates and the hotspot vs non-CpG
              flank ratio
          call:
            type: string
            description: >-
              call table (metric, value, cutoff, result) with the provisional UV call, supporting and warning
              metrics, the low-frequency hotspot vs flank result and a manual review flag
