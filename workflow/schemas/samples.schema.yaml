$schema: "https://json-schema.org/draft/2020-12/schema"
description: sample list
properties:
  sample:
    type: string
    description: sample id
  tumor_content:
    type: string
    description: tumor content
  deduplication:
    type: string
    description: optional, what type of deduplication should be used (umi = umi-deduplication, not specified or not umi = picard mark duplicate)
required:
  - sample
  - tumor_content
